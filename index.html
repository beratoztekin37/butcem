<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bütçem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#121110"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Düzen: tek sütunlu telefon uygulaması; altta sekme çubuğu, ortada + düğmesi. Renk: Excel'deki petrol yeşili + amber vurgu. */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --ink:#12292d; --muted:#5d7479; --line:#dbe5e4; --soft:#e8f0ef;
  --accent:#1f5c66; --accent-ink:#ffffff; --amber:#c97b0f; --pos:#1c8458; --neg:#c24a33;
  --c1:#1f5c66; --c2:#d98a1b; --c3:#4f7fe0; --c4:#c24a33; --c5:#6f9a32; --c6:#9366ad; --c7:#8a9aa0;
  --shadow:0 1px 2px rgba(18,41,45,.06),0 6px 20px rgba(18,41,45,.06);
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif; --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c191c; --surface:#13262a; --ink:#e6f1f0; --muted:#8aa6aa; --line:#223c41; --soft:#1a3237;
  --accent:#4fb3bf; --accent-ink:#06191c; --amber:#f0b24d; --pos:#4cc58d; --neg:#f08a74;
  --c1:#4fb3bf; --c2:#f0b24d; --c3:#7ea4f5; --c4:#f08a74; --c5:#9cc95b; --c6:#be94d6; --c7:#8aa0a6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c191c; --surface:#13262a; --ink:#e6f1f0; --muted:#8aa6aa; --line:#223c41; --soft:#1a3237;
  --accent:#4fb3bf; --accent-ink:#06191c; --amber:#f0b24d; --pos:#4cc58d; --neg:#f08a74;
  --c1:#4fb3bf; --c2:#f0b24d; --c3:#7ea4f5; --c4:#f08a74; --c5:#9cc95b; --c6:#be94d6; --c7:#8aa0a6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:104px;position:relative}
.view{display:none;animation:rise .35s ease both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* splash */
#splash{position:fixed;inset:0;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;transition:opacity .5s ease,visibility .5s}
#splash.gone{opacity:0;visibility:hidden}
#splash svg{width:84px;height:84px}
#splash .ring{stroke-dasharray:226;stroke-dashoffset:226;animation:draw .9s .1s ease forwards}
#splash .bar{transform-origin:50% 100%;transform:scaleY(0);animation:grow .5s ease forwards}
#splash .bar:nth-of-type(1){animation-delay:.55s}#splash .bar:nth-of-type(2){animation-delay:.7s}#splash .bar:nth-of-type(3){animation-delay:.85s}
#splash b{font:700 26px var(--font-display);letter-spacing:.01em;opacity:0;animation:fade .5s .9s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes grow{to{transform:scaleY(1)}}@keyframes fade{to{opacity:1}}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font:700 20px var(--font-display);margin:0}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.mnav button:active{background:var(--soft)}
.mnav span{min-width:104px;text-align:center;font-weight:600}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font:600 13px var(--font-body);margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hero{background:var(--accent);color:var(--accent-ink);padding:20px 18px 16px}
.hero small{opacity:.8;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.hero .big{font:700 38px/1.1 var(--font-display);margin:4px 0 14px}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap}
.hero .chips div{background:rgba(255,255,255,.14);border-radius:12px;padding:7px 11px;min-width:0}
.hero .chips span{display:block;font-size:11px;opacity:.8}
.hero .chips b{font:600 14px var(--font-display)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.trio div{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:0}
.trio span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.trio b{font:600 16px var(--font-display);display:block;margin-top:2px;overflow-wrap:anywhere}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:168px;height:168px;flex:none;margin:0 auto}
.donut circle.seg{fill:none;stroke-width:22;transform:rotate(-90deg);transform-origin:50% 50%;stroke-linecap:butt}
.legend{flex:1;min-width:170px;display:grid;gap:7px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend em{margin-left:auto;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.catrow{border-top:1px solid var(--line);padding:11px 0}
.catrow:first-of-type{border-top:0}
.catrow .h{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.catrow .dot{width:10px;height:10px;border-radius:50%;flex:none}
.catrow .n{flex:1;font-weight:500}
.catrow .v{font:600 14px var(--font-display)}
.catrow .v.z{color:var(--muted);font-weight:500}
.catrow .pill{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;padding-left:20px}
.catrow .pill span{background:var(--soft);border-radius:8px;padding:3px 8px;font-size:12px}
.catrow .pill b{font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--soft);margin:7px 0 0 20px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;width:0;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.bal{display:grid;gap:2px}
.bal .r{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.bal .r:first-child{border-top:0}
.bal .r .l small{display:block;color:var(--muted);font-size:11px}
.bal input{width:120px;text-align:right;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);font:600 14px var(--font-display)}
.alert{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--amber) 16%,var(--surface));border-radius:14px;padding:12px 14px;margin-bottom:14px;width:100%;text-align:left}
.alert b{flex:1}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--neg) 14%,var(--surface));color:var(--neg)}
.btn.block{width:100%}
.demo{background:color-mix(in srgb,var(--c3) 14%,var(--surface));border-radius:12px;padding:9px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;font-size:13px}
.demo button{margin-left:auto;font-weight:600;color:var(--accent);white-space:nowrap}
/* hareketler */
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.fchips button{white-space:nowrap;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.fchips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day{color:var(--muted);font-size:12px;font-weight:600;margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.05em}
.tx{display:flex;align-items:center;gap:12px;background:var(--surface);padding:11px 12px;border-radius:14px;margin-bottom:6px;width:100%;text-align:left;box-shadow:var(--shadow)}
.tx .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font:700 13px var(--font-display);flex:none}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t small{color:var(--muted)}
.tx .a{font:600 14px var(--font-display);white-space:nowrap}
.tx.warn .t small{color:var(--amber);font-weight:600}
/* analiz */
.ins{display:grid;gap:0}
.ins div{padding:11px 0;border-top:1px solid var(--line)}
.ins div:first-child{border-top:0}
.ins small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
svg text{fill:var(--muted);font:11px var(--font-body)}
.chart{width:100%;height:auto;display:block}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end}
nav button.t{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;padding:4px 0}
nav button.t.on{color:var(--accent);font-weight:600}
nav svg{width:22px;height:22px}
nav .plus{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 8px 20px rgba(31,92,102,.35)}
nav .plus svg{width:26px;height:26px}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,15,17,.5);z-index:30;opacity:0;visibility:hidden;transition:opacity .25s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:10px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font:700 18px var(--font-display);margin:0 0 12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.amt{width:100%;border:0;background:none;font:700 40px var(--font-display);text-align:center;padding:6px 0;color:var(--ink);outline:none}
.amt::placeholder{color:var(--line)}
.field{display:block;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;margin-top:10px}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.cats button{padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.cats button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lbl{font-size:12px;color:var(--muted);margin-top:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.row2{display:flex;gap:10px;margin-top:14px}
.row2 .btn{flex:1}
.q{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.q .d{color:var(--muted);font-size:12px}
.q .m{font:700 22px var(--font-display);margin:2px 0}
.q .w{font-weight:500;overflow-wrap:anywhere}
.q label{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px 14px;text-align:center;color:var(--muted)}
.drop b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.hint{color:var(--muted);font-size:12px;margin-top:8px}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it span{flex:1;min-width:0;overflow-wrap:anywhere}
.list .it small{color:var(--muted)}
textarea.field{min-height:84px;font:12px ui-monospace,monospace}
.empty{text-align:center;padding:30px 12px}
.empty h2{font:700 22px var(--font-display);margin:10px 0 6px;text-transform:none;letter-spacing:0;color:var(--ink)}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:34ch}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;opacity:0;transition:.3s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* etkileşim ve akış animasyonları */
.donut circle.seg{cursor:pointer;transition:stroke-width .28s cubic-bezier(.3,.8,.3,1),opacity .25s,stroke-dasharray .8s}
.donut circle.seg.sel{stroke-width:30}
.donut.has-sel circle.seg:not(.sel){opacity:.3}
.donut text{transition:opacity .18s;pointer-events:none}.donut text.sw{opacity:0}
.legend div[data-sel]{cursor:pointer;border-radius:8px;padding:3px 6px;margin:-3px -6px;transition:background .2s,opacity .25s}
.legend.has-sel div[data-sel]:not(.sel){opacity:.45}
.legend div.sel{background:var(--soft)}
.dpanel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.3,.8,.3,1)}
.dpanel.on{grid-template-rows:1fr}
.dpanel>.in{overflow:hidden;min-height:0}
.dpanel .dh{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-weight:600}
.dli{display:flex;gap:10px;justify-content:space-between;padding:7px 0;font-size:13px;opacity:0;transform:translateY(6px);animation:rise .32s ease forwards;animation-delay:calc(var(--i)*.04s + .12s)}
.dli span:first-child{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.dli b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.view.on>.card,.view.on>.trio,.view.on>.alert{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
.view.on>*:nth-child(2){animation-delay:.05s}.view.on>*:nth-child(3){animation-delay:.1s}.view.on>*:nth-child(4){animation-delay:.15s}.view.on>*:nth-child(5){animation-delay:.2s}.view.on>*:nth-child(n+6){animation-delay:.25s}
.btn,.t,.chips span,.cats button{transition:transform .12s ease,background .2s,opacity .2s}
.btn:active,.t:active,.cats button:active{transform:scale(.96)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

  <svg viewBox="0 0 84 84" fill="none"><circle class="ring" cx="42" cy="42" r="36" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <rect class="bar" x="24" y="44" width="9" height="16" rx="2" fill="currentColor"/><rect class="bar" x="37.5" y="34" width="9" height="26" rx="2" fill="currentColor"/><rect class="bar" x="51" y="24" width="9" height="36" rx="2" fill="currentColor"/></svg>
  <b>Bütçem</b>
</div>

<div id="app">
  <div class="top"><h1 id="vt">Özet</h1><div class="mnav" id="mnav"></div></div>
  <section class="view on" id="v-ozet"></section>
  <section class="view" id="v-hareket"></section>

</div>

<nav><div class="in">
  <button class="t on" data-go="ozet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Özet</button>
  <button class="t" data-go="hareket"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Hareketler</button>
  <div><button class="plus" id="addbtn" aria-label="Ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <button class="t" data-go="analiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 16v-5M11 16V6M16 16v-8M21 16v-3"/></svg>Analiz</button>

</div></nav>

<script>
/* Garanti hesap hareketleri PDF ayrıştırıcı: sayfa başına [{s, x, y}] listesi alır. */
function parseTR(str) {
  let t = String(str).replace(/TL/g, '').replace(/\s/g, '');
  const neg = t.startsWith('-');
  t = t.replace(/^[+-]/, '').replace(/\./g, '').replace(',', '.');
  const n = parseFloat(t);
  return isNaN(n) ? NaN : (neg ? -n : n);
}
function groupLines(items) {
  const rows = [];
  items.filter(i => i.s.trim()).sort((a, b) => b.y - a.y || a.x - b.x).forEach(it => {
    const r = rows.find(r => Math.abs(r.y - it.y) <= 2.5);
    if (r) r.items.push(it); else rows.push({ y: it.y, items: [it] });
  });
  rows.sort((a, b) => b.y - a.y);
  rows.forEach(r => r.items.sort((a, b) => a.x - b.x));
  return rows;

var CKEY = 'butcem.cloud', CLOUD = null, CTIMER = null, CBUSY = false;
function cloudLoad() { try { CLOUD = JSON.parse(localStorage.getItem(CKEY) || 'null'); } catch (e) { CLOUD = null; } return CLOUD; }
function cloudSave() { try { localStorage.setItem(CKEY, JSON.stringify(CLOUD)); } catch (e) {} }
function cloudSoon() {
  if (!cloudLoad() || !CLOUD.url || S.demo) return;
  clearTimeout(CTIMER); CTIMER = setTimeout(cloudPush, 2500);
}
function cloudStatus() {
  var el = document.getElementById('cstat'); if (!el) return;
  var c = cloudLoad();
  el.textContent = !c || !c.url ? 'Bağlı değil.' : c.err ? 'Son yedek alınamadı: ' + c.err : c.last ? 'Son yedek: ' + new Date(c.last).toLocaleString('tr-TR') : 'Bağlandı, henüz yedek alınmadı.';
}
function cloudPush(manual) {
  var c = cloudLoad(); if (!c || !c.url || CBUSY || S.demo) return;
  if (!S.tx.length && !(S.installments || []).length) { if (manual) toast('Boş veri yedeklenmez'); return; }
  CBUSY = true;
  fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: c.key, action: 'save', data: S }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { CBUSY = false; cloudLoad(); if (j && j.ok) { CLOUD.last = Date.now(); CLOUD.err = ''; if (manual) toast('Yedeklendi'); } else { CLOUD.err = (j && j.err) || 'bilinmeyen hata'; if (manual) toast('Yedeklenemedi'); } cloudSave(); cloudStatus(); })
    .catch(function () { CBUSY = false; cloudLoad(); CLOUD.err = 'internet yok'; cloudSave(); cloudStatus(); if (manual) toast('Yedeklenemedi, internet?'); });
}
function cloudPull() {
  var c = cloudLoad(); if (!c || !c.url) { toast('Önce bağla'); return; }

    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.ok || !j.data || !j.data.tx) { toast('Bulutta yedek bulunamadı'); return; }

    .catch(function () { toast('Bağlanamadı, internet?'); });
}

function handlePDF(file) {
  if (!file) return;

  fr.onload = function () {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
    pdfjsLib.getDocument({ data: new Uint8Array(fr.result) }).promise.then(function (doc) {
      var jobs = []; for (var p = 1; p <= doc.numPages; p++) jobs.push(doc.getPage(p).then(function (pg) { return pg.getTextContent(); }));
      return Promise.all(jobs);
    }).then(function (pages) {
      var res = parseGarantiPages(pages.map(function (tc) { return tc.items.map(function (i) { return { s: i.str, x: i.transform[4], y: i.transform[5] }; }); }));
      if (!res.rows.length) { openSheetKeep('<h3>Hareket bulunamadı</h3><p class="hint">Bu dosya Garanti hesap hareketleri PDF\'i gibi görünmüyor. Garanti Mobil ya da İnternet Bankacılığı\'ndan indirdiğin hesap hareketleri PDF\'ini dene.</p><div class="row2"><button class="btn ghost" data-act="close">Kapat</button></div>'); return; }
      PDFRES = res;
      var keys = {}; S.tx.forEach(function (t) { keys[t.key] = 1; });
      var nw = res.rows.filter(function (r) { return !keys[rowKey(r)]; });
      var dates = res.rows.map(function (r) { return r.date; }).sort();
      openSheetKeep('<h3>' + res.rows.length + ' hareket bulundu</h3><div class="q" style="box-shadow:none;background:var(--soft)"><div class="d">' + fdate(dates[0]) + ' – ' + fdate(dates[dates.length - 1]) + '</div><div class="m num">' + nw.length + ' yeni</div><div class="d">' + (res.rows.length - nw.length) + ' tanesi zaten kayıtlı' + (res.bakiye != null ? ' · PDF bakiyesi ' + fmt(res.bakiye) : '') + '</div></div>' +
        '<div class="row2"><button class="btn ghost" data-act="close">Vazgeç</button><button class="btn" data-act="importpdf">Ekle</button></div>');
    }).catch(function (e) { openSheetKeep('<h3>PDF okunamadı</h3><p class="hint">' + esc(e && e.message || e) + '</p><div class="row2"><button class="btn ghost" data-act="close">Kapat</button></div>'); });
  };
  fr.readAsArrayBuffer(file);

var PDFRES = null;
function rowKey(r) { return 'g|' + r.date + '|' + norm(r.desc) + '|' + r.amt + '|' + r.bal; }
function importPDF() {
  var res = PDFRES; if (!res) return;
  var keys = {}; S.tx.forEach(function (t) { keys[t.key] = 1; });
  var at = Date.now(), added = 0;
  var groups = pendGroups(), matched = 0;
  res.rows.slice().reverse().forEach(function (r, i) {
    var k = rowKey(r); if (keys[k]) return;

      if (Math.abs(sum - r.amt) < 0.011 && Math.abs(dayNum(g[0].date) - dayNum(r.date)) <= 4) {
        g.forEach(function (x, xi) { x.key = xi === 0 ? k : 'split|' + k + '|' + x.id; x.bal = r.bal; x.at = at; x.date = r.date; delete x.pend; if (!x.desc) x.desc = r.desc; if (xi === 0) x.label = r.label; });
        groups[gi] = null; keys[k] = 1; matched++; return;
      }
    }
    S.tx.push({ id: uid(), date: r.date, desc: r.desc, label: r.label, amt: r.amt, cat: categorize(r.desc, r.label, r.amt), src: 'garanti', bal: r.bal, at: at, key: k }); added++;
  });
  var newest = res.rows[0], old = S.anchors.garanti;

}

});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { QUERY = e.target.value; var pos = e.target.selectionStart; renderHareket(); var q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === 'f-date' && DRAFT) DRAFT.touchedDate = true;
});
document.addEventListener('change', function (e) {
  if (e.target.dataset && e.target.dataset.man) {
    var v = parseFloat(String(e.target.value).replace(/\./g, '').replace(',', '.'));
    S.manual[e.target.dataset.man] = isNaN(v) ? 0 : v; save(); render();
  }
  if (e.target.dataset && e.target.dataset.anc) {
    var w = parseFloat(String(e.target.value).replace(/\./g, '').replace(',', '.'));
    if (!isNaN(w)) S.anchors[e.target.dataset.anc] = { amt: w, date: todayStr(), at: Date.now() };
    save(); render();
  }
  if (e.target.id === 'pdfin') { handlePDF(e.target.files[0]); e.target.value = ''; }
});

/* ================= Başlangıç ================= */
load();
applyUI();
MONTH = mk(todayStr());
(function pickMonth() { if (S.tx.length) { var ms = S.tx.map(function (t) { return mk(t.date); }).sort(); if (!S.tx.some(function (t) { return mk(t.date) === MONTH; })) MONTH = ms[ms.length - 1]; } })();
render();
setTimeout(function () { document.getElementById('splash').classList.add('gone'); }, 1700);
</script>
